name: Validate Public Curriculum

on:
  push:
    paths:
      - 'content/**'
      - 'curriculum/**'
      - 'knowledge/**'
      - 'tools/**'
      - 'map/**'
      - '.github/workflows/validate-curriculum.yml'
  pull_request:
    paths:
      - 'content/**'
      - 'curriculum/**'
      - 'knowledge/**'
      - 'tools/**'
      - 'map/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python tooling
        run: python3 -m compileall -q tools
      - name: Check JavaScript syntax
        run: node --check tools/sym256.js && node --check tools/sat_pairs.js
      - name: Curriculum lint regression cases
        run: python3 tools/test_curriculum_integrity_lint.py
      - name: Exact arithmetic lesson and assessment checks
        run: |
          python3 tools/validate_arithmetic_foundations.py
          python3 tools/validate_arithmetic_14_16.py
          python3 tools/validate_arithmetic_17_20.py
      - name: Curriculum integrity lint
        run: python3 tools/curriculum_integrity_lint.py
      - name: Verify Education-16 attachments
        run: python3 tools/edu16.py --verify
      - name: Validate JSON lesson datasets
        run: |
          node - <<'JS'
          const fs=require('fs'), path=require('path');
          const roots=['content/lessons','curriculum'];
          let files=[];
          for(const root of roots){
            if(!fs.existsSync(root)) continue;
            const walk=d=>{for(const e of fs.readdirSync(d,{withFileTypes:true})){const p=path.join(d,e.name); if(e.isDirectory()) walk(p); else if(e.name.endsWith('.json')) files.push(p);}};
            walk(root);
          }
          let lessons=0;
          for(const f of files){
            const v=JSON.parse(fs.readFileSync(f,'utf8'));
            if(f.includes('/content/lessons/')){
              if(!Array.isArray(v)) throw new Error(f+': expected lesson array');
              for(const l of v){
                for(const k of ['id','subject_id','level','lesson_number','title','content']) if(l[k]===undefined) throw new Error(f+': missing '+k);
                if(!Number.isInteger(l.level)||l.level<1||l.level>8) throw new Error(f+': invalid level');
                lessons++;
              }
            }
          }
          console.log(`Validated ${files.length} JSON files and ${lessons} structured lessons.`);
          JS
