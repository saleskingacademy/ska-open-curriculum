name: Validate Public Curriculum

on:
  push:
    paths:
      - 'content/**'
      - 'curriculum/**'
      - 'knowledge/**'
      - 'tools/audit_subject_integrity.py'
      - 'tools/audit_catalog.py'
      - 'tools/audit_lesson_publication.py'
      - '.github/workflows/validate-curriculum.yml'
  pull_request:
    paths:
      - 'content/**'
      - 'curriculum/**'
      - 'knowledge/**'
      - 'tools/audit_subject_integrity.py'
      - 'tools/audit_catalog.py'
      - '.github/workflows/validate-curriculum.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON lesson datasets
        run: |
          node - <<'JS'
          const fs=require('fs'), path=require('path');
          const roots=['content/lessons','curriculum'];
          let files=[];
          for(const root of roots){
            if(!fs.existsSync(root)) continue;
            const walk=d=>{for(const e of fs.readdirSync(d,{withFileTypes:true})){const p=path.join(d,e.name); if(e.isDirectory()) walk(p); else if(e.name.endsWith('.json')) files.push(p);}};
            walk(root);
          }
          let lessons=0;
          for(const f of files){
            const v=JSON.parse(fs.readFileSync(f,'utf8'));
            if(f.includes('/content/lessons/')){
              if(!Array.isArray(v)) throw new Error(f+': expected lesson array');
              for(const l of v){
                for(const k of ['id','subject_id','level','lesson_number','title','content']) if(l[k]===undefined) throw new Error(f+': missing '+k);
                if(!Number.isInteger(l.level)||l.level<1||l.level>8) throw new Error(f+': invalid level');
                lessons++;
              }
            }
          }
          console.log(`Validated ${files.length} JSON files and ${lessons} structured lessons.`);
          JS

      - name: Verify subject identifiers, knowledge files, and lesson assignments
        run: python3 tools/audit_subject_integrity.py --report audit-results/subject-integrity.json

      - name: Verify catalog subject names and calculated totals
        run: python3 tools/audit_catalog.py

      - name: Block template republishing and unregistered lesson subject IDs
        run: python3 tools/audit_lesson_publication.py

      - name: Upload full subject integrity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subject-integrity
          path: audit-results/subject-integrity.json
          retention-days: 30
