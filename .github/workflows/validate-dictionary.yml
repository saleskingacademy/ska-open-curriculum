name: Validate Dictionary
# Every shard must parse, every word must have an identifier, and every definition a
# part of speech, text and source.
on:
  push:
    paths: ['dictionary/**', 'tools/check_dictionary.py', '.github/workflows/validate-dictionary.yml']
  pull_request:
    paths: ['dictionary/**', 'tools/check_dictionary.py']
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_dictionary.py
