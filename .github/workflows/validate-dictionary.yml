name: Validate Dictionary
# Every word and definition must keep a valid, unique DNA-16 anchor and spent address,
# and no chain or time digits may be published.
on:
  push:
    paths: ['dictionary/**', 'tools/build_dictionary.py', '.github/workflows/validate-dictionary.yml']
  pull_request:
    paths: ['dictionary/**', 'tools/build_dictionary.py']
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_dictionary.py --verify
