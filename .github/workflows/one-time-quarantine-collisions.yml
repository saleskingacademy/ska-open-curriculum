name: One-time quarantine overlapping lesson slots
on:
  push:
    branches:
      - fix/lesson-publication-canonical-20261008
    paths:
      - tools/quarantine_colliding_lessons.py
      - .github/workflows/one-time-quarantine-collisions.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Move slot collisions to review archive, retaining originals
        run: python3 tools/quarantine_colliding_lessons.py
      - name: Commit non-destructive publication correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/lessons content/quarantine/overlapping-lessons
          if ! git diff --cached --quiet; then
            git commit -m "fix: archive overlapping lesson versions without deleting instructional content"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Validate corrected publication set
        run: python3 tools/audit_lesson_publication.py
