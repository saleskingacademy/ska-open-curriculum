name: One-time stable lesson ID repair
on:
  push:
    branches:
      - fix/lesson-publication-canonical-20261008
    paths:
      - tools/repair_missing_lesson_ids.py
      - .github/workflows/one-time-fix-lesson-ids.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Backfill missing stable lesson IDs only
        run: python3 tools/repair_missing_lesson_ids.py
      - name: Commit changed lesson datasets on correction branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/lessons/
          if ! git diff --cached --quiet; then
            git commit -m "fix: assign stable IDs to legacy lesson records"
            git pull --rebase origin "HEAD:${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Verify all public lesson ID and quarantine contracts
        run: python3 tools/audit_lesson_publication.py
