name: Repair and inspect SKA subject index
on:
  push:
    branches:
      - fix/curriculum-subject-integrity-20261008
    paths:
      - tools/audit_subject_integrity.py
      - knowledge/**
      - .github/workflows/repair-subject-index-20261008.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Regenerate index from the canonical files
        run: python3 tools/audit_subject_integrity.py --repair-index
      - name: Commit metadata-only correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add knowledge/index.json
          if ! git diff --cached --quiet; then
            git commit -m "fix: align knowledge index with 1,119 subject files"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Validate index and audit lesson/content alignment
        run: python3 tools/audit_subject_integrity.py --report audit-results/subject-integrity.json
      - name: Upload full subject integrity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subject-integrity
          path: audit-results/subject-integrity.json
          retention-days: 30
